id = "artificer"
name = "Artificer"
version = "1.0.0"         # release-please sets it in each release pull request
authors = ["mo_shark"]
description = "Keeps EU4 fast in long sessions: deletes the message pop-ups the game keeps after you close them."
api = 2
entry = "artificer.dll"
phase = "main"
symbols = "symbols.toml"   # the game build comes from here
settings = "settings.toml"
# Required: true if the plugin can change the simulation's state or results.
affects_gameplay = false
issues = "https://github.com/mosharky/Artificer/issues"
repository = "https://github.com/mosharky/Artificer"

# The frame event, on the game's main thread (anvil_game.h).
[[dependencies]]
id = "anvil-game"
version = "^1"
